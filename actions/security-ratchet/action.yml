name: Security ratchet
description: >-
  Never add, baseline shrinks only. mode pr blocks a PR that adds a critical/high code-scanning alert the
  base branch lacks; mode baseline fails when open alerts exceed .github/security-baseline.json (shrink-only).
  An unreadable source is recorded blind and never fails. Needs security-events: read on the job.
  Pair with secret-scan.yml (real secrets) and actions/dependency-review-action with fail-on-severity: high.
inputs:
  mode: {description: pr or baseline, default: pr}
  wait-minutes: {description: how long to wait for the PR code-scanning analysis, default: '20'}
  github-token: {description: token with security-events read, default: '${{ github.token }}'}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        WAIT_MINUTES: ${{ inputs.wait-minutes }}
        MODE: ${{ inputs.mode }}
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/ratchet.mjs" "$MODE"
