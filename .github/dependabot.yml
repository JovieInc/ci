# Auto-update policy: canon/update-policy.json + policy/UPDATE-POLICY.md.
# Patch/minor land on green through dependabot-auto-merge-self.yml; majors wait
# for the agent compatibility lane.
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directories:
      - '/'
      - '/actions/*'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Etc/UTC'
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 1
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'automated'
    groups:
      actions-non-major:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
