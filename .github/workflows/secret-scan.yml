# Shared gitleaks secret scan (workflow_call). Pin consumers to a full commit SHA:
#   uses: JovieInc/ci/.github/workflows/secret-scan.yml@<sha>
# Scans the pushed or PR commit range by default; full-history: true scans every ref.
# The consumer's .gitleaks.toml applies when present, otherwise gitleaks defaults.
name: Secret Scan

on:
  workflow_call:
    inputs:
      full-history:
        description: Scan all refs and history instead of the pushed or PR commit range.
        required: false
        type: boolean
        default: false
      fail-on-findings:
        description: Fail the job on findings. Set false while a consumer qualifies in shadow.
        required: false
        type: boolean
        default: true

permissions: {}

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned gitleaks
        env:
          GITLEAKS_ARCHIVE_URL: 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          curl --fail --silent --show-error --location --output "$dir/gitleaks.tar.gz" "$GITLEAKS_ARCHIVE_URL"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$dir/gitleaks.tar.gz" -C "$dir" gitleaks
          echo "$dir" >> "$GITHUB_PATH"

      - name: Resolve scan range
        id: range
        env:
          FULL_HISTORY: ${{ inputs.full-history }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          base=""
          case "$EVENT_NAME" in
            push) base="$PUSH_BEFORE" ;;
            pull_request) base="$PR_BASE_SHA" ;;
            pull_request_target)
              # github.sha is the base tip here, so PR commits would never be scanned.
              echo "::error::secret-scan does not support pull_request_target; call it from pull_request."
              exit 1 ;;
            merge_group) base="$MERGE_GROUP_BASE_SHA" ;;
          esac
          if [ "$FULL_HISTORY" = "true" ]; then
            opts="--all"
          elif [ -n "$base" ] && [ "$base" != "$zero" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            opts="${base}..${HEAD_SHA}"
          else
            # New branch, force push, schedule or dispatch: no trustworthy base, so scan everything reachable.
            opts="$HEAD_SHA"
          fi
          echo "log-opts=$opts" >> "$GITHUB_OUTPUT"
          echo "Scanning: git log $opts"

      - name: Run gitleaks
        env:
          LOG_OPTS: ${{ steps.range.outputs.log-opts }}
          FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        run: |
          set -euo pipefail
          args=(git --log-opts="$LOG_OPTS" --redact=100 --no-banner --no-color --exit-code=1)
          if [ -f .gitleaks.toml ]; then args+=(--config=.gitleaks.toml); fi
          if gitleaks "${args[@]}" .; then exit 0; fi
          if [ "$FAIL_ON_FINDINGS" = "true" ]; then exit 1; fi
          echo "::warning::gitleaks reported findings; fail-on-findings is false (shadow mode)."
