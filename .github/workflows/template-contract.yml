name: Template contract

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  template-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Lint workflows
        uses: rhysd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106 # v1.7.7
      - name: Fresh scaffold and 29 negative cases
        run: node scripts/test-jovie-ci-template-scaffold.mjs
      - name: Dispatch pull request contract
        run: node scripts/ci-release-prevention-dispatch.mjs --event pull_request
      - name: Dispatch merge group contract
        run: node scripts/ci-release-prevention-dispatch.mjs --event merge_group
      - name: Simulate post-create compliance controller
        run: node simulators/post-create-compliance/controller.test.mjs
