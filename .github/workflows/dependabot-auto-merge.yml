# Canonical Dependabot auto-merge — published in JovieInc/ci (workflow_call).
# Consumer repos: thin wrapper that `uses:` this file @main.
name: Dependabot Auto-Merge

on:
  workflow_call:
    inputs:
      certification_labels:
        description: >-
          Comma-separated labels applied to patch/minor bumps. Consumers whose
          queue admission reads a different label (for example LogYourBody's
          machine-certified) override this so the enrollment controller sees
          the certification it requires.
        required: false
        type: string
        default: 'merge-queue,tim-approved'

permissions: {}

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out dependency declaration tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JovieInc/ci
          ref: main
          path: .company-ci
          persist-credentials: false
          sparse-checkout: |
            scripts/dependabot-declare.mjs
            canon/dependency-migration-gates.json
          sparse-checkout-cone-mode: false

      - name: Declare dependency upgrades in the PR body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATED_DEPENDENCIES: ${{ steps.meta.outputs.updated-dependencies-json }}
        run: |
          set -euo pipefail
          printf '%s' "$UPDATED_DEPENDENCIES" > "$RUNNER_TEMP/dependabot-updated.json"
          gh pr view "$PR_URL" --json body --jq .body > "$RUNNER_TEMP/dependabot-body.txt"
          node .company-ci/scripts/dependabot-declare.mjs \
            --updated "$RUNNER_TEMP/dependabot-updated.json" \
            --body "$RUNNER_TEMP/dependabot-body.txt" \
            --gates .company-ci/canon/dependency-migration-gates.json \
            --out "$RUNNER_TEMP/dependabot-body-out.txt" > "$RUNNER_TEMP/dependabot-summary.json"
          gh pr edit "$PR_URL" --body-file "$RUNNER_TEMP/dependabot-body-out.txt"

      - name: Certify patch + minor for queue admission
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          CERTIFICATION_LABELS: ${{ inputs.certification_labels }}
          DEPENDENCY_NAMES: ${{ steps.meta.outputs.dependency-names }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          set -euo pipefail
          echo "Dependency: $DEPENDENCY_NAMES"
          echo "Update type: $UPDATE_TYPE"
          IFS=',' read -ra labels <<<"$CERTIFICATION_LABELS"
          for label in "${labels[@]}"; do
            label="$(echo "$label" | xargs)"
            [ -n "$label" ] || continue
            gh pr edit --add-label "$label" "$PR_URL" || true
          done

      - name: Hold major upgrades as drafts for qualification
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          gh pr ready --undo "$PR_URL"
          gh pr edit --add-label dependency-major "$PR_URL" || echo '::warning::Could not add dependency-major label'
          migration_gated="$(node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const summary = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'dependabot-summary.json'), 'utf8'));
          const gated = new Set(summary.gated);
          const lines = summary.updates.map(({ dependencyName, prevVersion, newVersion }) =>
            `- ${dependencyName}: ${prevVersion} → ${newVersion} (${gated.has(dependencyName) ? 'gated' : 'not gated'})`);
          lines.push('', 'promotion to ready happens when the full suite + migration probe are green and the JOV-13053 90% bar passes (LATER: JOV-13093 promotion job)');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          process.stdout.write(String(gated.size > 0));
          NODE
          )"
          if [ "$migration_gated" = true ]; then
            gh pr edit --add-label migration-gated "$PR_URL" || echo '::warning::Could not add migration-gated label'
          fi
