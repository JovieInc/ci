# Canonical Dependabot auto-merge — published in JovieInc/ci (workflow_call).
# Consumer repos: thin wrapper that `uses:` this file @main.
name: Dependabot Auto-Merge

on:
  workflow_call:
    inputs:
      certification_labels:
        description: >-
          Comma-separated labels applied to patch/minor bumps. Consumers whose
          queue admission reads a different label (for example LogYourBody's
          machine-certified) override this so the enrollment controller sees
          the certification it requires.
        required: false
        type: string
        default: 'merge-queue,tim-approved'

permissions: {}

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Certify patch + minor for queue admission
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          CERTIFICATION_LABELS: ${{ inputs.certification_labels }}
        run: |
          set -euo pipefail
          echo "Dependency: ${{ steps.meta.outputs.dependency-names }}"
          echo "Update type: ${{ steps.meta.outputs.update-type }}"
          IFS=',' read -ra labels <<<"$CERTIFICATION_LABELS"
          for label in "${labels[@]}"; do
            label="$(echo "$label" | xargs)"
            [ -n "$label" ] || continue
            gh pr edit --add-label "$label" "$PR_URL" || true
          done

      - name: Note major bump requires manual review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "Major bump for ${{ steps.meta.outputs.dependency-names }} — manual review required"