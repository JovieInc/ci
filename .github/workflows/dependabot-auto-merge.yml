# Canonical Dependabot auto-merge — published in JovieInc/ci (workflow_call).
# Consumer repos: thin wrapper that `uses:` this file at a full commit SHA.
# Policy: canon/update-policy.json + policy/UPDATE-POLICY.md.
#   patch / minor (1.x+)  -> certification labels, and auto-merge armed when
#                            arm_auto_merge is true; lands only on green checks.
#   major, or 0.x minor   -> labelled for the agent compatibility lane; never
#                            armed here and never routed to a human reviewer.
name: Dependabot Auto-Merge

on:
  workflow_call:
    inputs:
      certification_labels:
        description: >-
          Comma-separated labels applied to patch/minor bumps. Consumers whose
          queue admission reads a different label (for example LogYourBody's
          machine-certified) override this so the enrollment controller sees
          the certification it requires.
        required: false
        type: string
        default: 'merge-queue,tim-approved'
      arm_auto_merge:
        description: >-
          Arm GitHub auto-merge (squash) on safe bumps. For repos without a
          label-driven queue enroller; required checks still gate the merge.
        required: false
        type: boolean
        default: false
      compat_label:
        description: Label that routes majors and 0.x minors to the agent compatibility lane.
        required: false
        type: string
        default: 'compat-check'

permissions: {}

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Classify bump
        id: tier
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          PREVIOUS: ${{ steps.meta.outputs.previous-version }}
          NEXT: ${{ steps.meta.outputs.new-version }}
        run: |
          set -euo pipefail
          tier=hold
          case "$UPDATE_TYPE" in
            version-update:semver-patch) tier=safe ;;
            version-update:semver-minor)
              # A 0.x minor is a breaking release: treat it as a major.
              if [ "${PREVIOUS%%.*}" = "0" ] || [ "${NEXT%%.*}" = "0" ]; then tier=major; else tier=safe; fi ;;
            version-update:semver-major) tier=major ;;
          esac
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "Dependency: ${{ steps.meta.outputs.dependency-names }} ($UPDATE_TYPE, $PREVIOUS -> $NEXT): $tier"

      - name: Certify patch + minor for queue admission
        if: steps.tier.outputs.tier == 'safe'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          CERTIFICATION_LABELS: ${{ inputs.certification_labels }}
        run: |
          set -euo pipefail
          IFS=',' read -ra labels <<<"$CERTIFICATION_LABELS"
          for label in "${labels[@]}"; do
            label="$(echo "$label" | xargs)"
            [ -n "$label" ] || continue
            gh pr edit --add-label "$label" "$PR_URL" || true
          done

      - name: Arm auto-merge on green
        if: steps.tier.outputs.tier == 'safe' && inputs.arm_auto_merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Route major to the agent compatibility lane
        if: steps.tier.outputs.tier == 'major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          COMPAT_LABEL: ${{ inputs.compat_label }}
        run: |
          gh label create "$COMPAT_LABEL" --color FBCA04 --description "Major update: agent compatibility check, then canary" 2>/dev/null || true
          gh pr edit --add-label "$COMPAT_LABEL" "$PR_URL" || true
          echo "Major bump for ${{ steps.meta.outputs.dependency-names }}: routed to the agent compatibility lane (no human review)."
