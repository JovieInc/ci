name: Secret scan qualification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  behavior:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'pyyaml>=6,<7'
      - run: python3 -m unittest discover -s tests -p test_secret_scan_workflow.py -v
  scan:
    uses: ./.github/workflows/secret-scan.yml
    permissions:
      contents: read
