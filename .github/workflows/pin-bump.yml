# When canon/ or guards/ change on main, open a pin-bump PR in every consumer.
# Uses the jovie-bot GitHub App (short-lived token). Needs repo variable JOVIE_BOT_APP_ID and
# secret JOVIE_BOT_PRIVATE_KEY; without them the job is a no-op.
name: Pin Bump
on:
  push:
    branches: [main]
    paths: ['canon/**', 'guards/**', 'certify/**', 'templates/public-app/**', '.github/workflows/company-guards.yml', '.github/workflows/public-app-certification.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Mint short-lived jovie-bot token
        id: app
        if: ${{ vars.JOVIE_BOT_APP_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.JOVIE_BOT_APP_ID }}
          private-key: ${{ secrets.JOVIE_BOT_PRIVATE_KEY }}
          owner: JovieInc
      - name: Open a bump PR per consumer
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "jovie-bot app not configured (JOVIE_BOT_APP_ID / JOVIE_BOT_PRIVATE_KEY); skipping"; exit 0; }
          gh auth setup-git
          for repo in $(node -e 'console.log(require("./canon/consumers.json").repos.join(" "))'); do
            gh repo clone "JovieInc/$repo" "w-$repo" -- --depth 1 -q || continue
            f="w-$repo/.github/workflows/company-guards.yml"
            [ -f "$f" ] || echo "$repo: company guards not wired"
            for wf in "$f" "w-$repo/.github/workflows/public-app-certification.yml"; do
              if [ -f "$wf" ]; then sed -i -E "s#(company-guards\.yml@|public-app-certification\.yml@|ci-ref: )[0-9a-f]{40}#\1$SHA#g" "$wf"; fi
            done
            # Public apps inherit the certification layer by default (canon/PUBLIC-APP-CERTIFICATION.md):
            # scaffold any missing stub for every app canon/public-apps.json registers to this repo.
            node templates/public-app/bootstrap.mjs --repo "JovieInc/$repo" --target "w-$repo" --sha "$SHA"
            git -C "w-$repo" add -A
            git -C "w-$repo" diff --cached --quiet && continue
            git -C "w-$repo" checkout -q -b "compounding/ci-pin-${SHA:0:8}"
            git -C "w-$repo" -c user.name=company-bot -c user.email=bot@jov.ie commit -qm "chore(ci): bump company guards pin to ${SHA:0:8}"
            git -C "w-$repo" push -q origin HEAD
            gh pr create -R "JovieInc/$repo" --head "compounding/ci-pin-${SHA:0:8}" --label compounding \
              --title "chore(ci): bump company guards pin to ${SHA:0:8}" --body "Automated pin bump from JovieInc/ci@$SHA. Scaffolds any missing public-app certification stubs (canon/PUBLIC-APP-CERTIFICATION.md)."
          done
