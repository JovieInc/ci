# Daily: list real GitHub/Vercel/Doppler resources, compare with canon/resources.json,
# open (or update) one issue with duplicates / unregistered / orphaned resources and a
# proposed action. Never deletes. Needs secrets VERCEL_TOKEN and DOPPLER_TOKEN; missing
# sources are reported as skipped in the issue.
# Event-driven: a GitHub org `repository` webhook or a Vercel `project.created` webhook is
# relayed as repository_dispatch type resource-created, so a create outside the registry is
# flagged within minutes. The daily cron stays as the backstop when a relay is down.
# JOV-13083: the signed relay (Jovie /api/webhooks/registry-create) sends this same
# resource-created event with client_payload {kind, name}. The registry-create job
# checks can-create and upserts a Linear duplicate issue, with GitHub issue fallback
# when Linear is unavailable or disabled via vars.REGISTRY_CREATE_LINEAR=off.
name: Resource Drift Scan
on:
  repository_dispatch:
    types: [resource-created]
  schedule: [{ cron: '17 6 * * *' }]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Workflow concurrency replaces older pending runs even without cancellation.
    # Only full rescans may collapse; independent resource-created events must run.
    concurrency:
      group: resource-drift
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Install CLIs
        run: |
          npm i -g vercel@59 >/dev/null 2>&1 || true
          curl -Ls https://cli.doppler.com/install.sh | sudo sh >/dev/null 2>&1 || true
      - name: Scan
        env:
          GH_TOKEN: ${{ secrets.RESOURCE_SCAN_GH_TOKEN || github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: node scripts/resource-drift.mjs > report.json
      - name: Open or update issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(node scripts/resource-issue.mjs count)
          title="resource-drift: $n finding(s)"
          body=$(node scripts/resource-issue.mjs body)
          gh label create resource-drift --color B60205 2>/dev/null || true
          existing=$(gh issue list --label resource-drift --state open --json number --jq '.[0].number')
          if [ "$n" = 0 ]; then [ -n "$existing" ] && gh issue close "$existing" -c "Clean scan."; exit 0; fi
          if [ -n "$existing" ]; then gh issue edit "$existing" --title "$title" --body "$body"; else gh issue create --label resource-drift --title "$title" --body "$body"; fi
  registry-create:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'resource-created'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: registry-create-${{ github.event.client_payload.kind }}-${{ github.event.client_payload.name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Check registry create
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          REGISTRY_CREATE_LINEAR: ${{ vars.REGISTRY_CREATE_LINEAR }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/registry-create-check.mjs
