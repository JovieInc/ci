name: Company Guards Self
on:
  pull_request:
    paths: ['canon/**', 'guards/**', 'certify/**', 'templates/public-app/**', 'scripts/resource-drift.mjs', 'scripts/tooling-drift.mjs', 'scripts/public-app-scan.mjs', 'test/**', '.github/workflows/**']
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 2 } # data-paths diffs the PR merge commit against its base
      - run: node scripts/tooling-drift.mjs check
      - run: node --test test/company-guards.test.mjs test/tracker-registry.test.mjs test/public-app-certification.test.mjs test/size-scope.test.mjs test/size-file-list.test.mjs
      - name: Dogfood the suite and pointer check
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node guards/run.mjs
